<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FieldSync Scheduler — Loop</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --border: #262626;
    --ink: #f5f5f5;
    --muted: #737373;
    --accent: #10b981;
    --accent-soft: rgba(16, 185, 129, 0.14);
    --warn: #f59e0b;
    --warn-soft: rgba(245, 158, 11, 0.14);
    --danger: #ef4444;
    --danger-soft: rgba(239, 68, 68, 0.14);
    --blue: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .stage {
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: 1fr 1.4fr 0.9fr;
    gap: 14px;
    padding: 18px 20px;
    align-items: stretch;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    position: relative;
    overflow: hidden;
  }
  .panel-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  /* ── Scene 1: slot pick ── */
  .slots { display: flex; flex-direction: column; gap: 7px; margin-top: 8px; }
  .slot {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 11px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    background: #111;
    transform: scale(1);
    transition: none;
  }
  .slot b { display: block; font-size: 13px; color: var(--ink); font-weight: 700; }
  .slot small { font-size: 10px; color: var(--muted); }
  .slot.pick {
    animation: slot-pick 6s ease-in-out infinite;
  }
  .slot:nth-child(1) { animation-name: slot-idle; }
  .slot:nth-child(2) { animation-name: slot-pick; }
  .slot:nth-child(3) { animation-name: slot-idle; }
  @keyframes slot-idle {
    0%, 100% { border-color: var(--border); background: #111; color: var(--muted); transform: scale(1); }
  }
  @keyframes slot-pick {
    0%, 18% { border-color: var(--border); background: #111; transform: scale(1); }
    22%, 55% { border-color: var(--accent); background: var(--accent-soft); transform: scale(1.03); box-shadow: 0 0 20px rgba(16,185,129,.15); }
    60%, 100% { border-color: var(--border); background: #111; transform: scale(1); }
  }
  .slot.pick b { animation: slot-label 6s ease-in-out infinite; }
  @keyframes slot-label {
    0%, 18% { color: var(--ink); }
    22%, 55% { color: var(--accent); }
    60%, 100% { color: var(--ink); }
  }
  .cursor {
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(16,185,129,.6);
    opacity: 0;
    animation: cursor-move 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes cursor-move {
    0%, 14% { opacity: 0; transform: translate(30px, 60px); }
    18% { opacity: 1; transform: translate(30px, 108px); }
    22%, 28% { opacity: 1; transform: translate(30px, 108px) scale(0.85); }
    32%, 100% { opacity: 0; transform: translate(30px, 108px); }
  }
  /* ── Scene 2: timeline ── */
  .timeline { margin-top: 6px; }
  .tl-row {
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }
  .tl-name { font-size: 10px; color: var(--muted); font-weight: 600; }
  .tl-track {
    height: 28px;
    background: #111;
    border: 1px solid var(--border);
    border-radius: 7px;
    position: relative;
    overflow: hidden;
  }
  .tl-block {
    position: absolute;
    top: 4px; bottom: 4px;
    border-radius: 5px;
    opacity: 0;
  }
  .tl-block.conflict {
    left: 18%; width: 22%;
    background: var(--danger-soft);
    border: 1px solid rgba(239,68,68,.4);
    animation: show-conflict 6s ease-in-out infinite;
  }
  .tl-block.booked {
    left: 48%; width: 24%;
    background: var(--accent-soft);
    border: 1px solid rgba(16,185,129,.45);
    animation: show-booked 6s ease-in-out infinite;
  }
  @keyframes show-conflict {
    0%, 30% { opacity: 0; transform: scaleX(0.6); }
    34%, 42% { opacity: 1; transform: scaleX(1); }
    46%, 100% { opacity: 0; transform: scaleX(0.6); }
  }
  @keyframes show-booked {
    0%, 38% { opacity: 0; transform: scaleX(0.6); }
    44%, 72% { opacity: 1; transform: scaleX(1); }
    78%, 100% { opacity: 0; transform: scaleX(0.6); }
  }
  .tl-x, .tl-check {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    font-weight: 800;
    opacity: 0;
  }
  .tl-x { left: 27%; color: var(--danger); animation: flash-x 6s ease-in-out infinite; }
  .tl-check { left: 57%; color: var(--accent); animation: flash-check 6s ease-in-out infinite; }
  @keyframes flash-x {
    0%, 32% { opacity: 0; }
    36%, 44% { opacity: 1; }
    48%, 100% { opacity: 0; }
  }
  @keyframes flash-check {
    0%, 42% { opacity: 0; }
    48%, 70% { opacity: 1; }
    76%, 100% { opacity: 0; }
  }
  .drive-arc {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    animation: drive-fade 6s ease-in-out infinite;
  }
  @keyframes drive-fade {
    0%, 34% { opacity: 0; }
    38%, 52% { opacity: 1; }
    58%, 100% { opacity: 0; }
  }
  .drive-arc svg { width: 100%; height: 100%; }
  /* ── Scene 3: SMS + confirm ── */
  .confirm-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: calc(100% - 28px);
    gap: 12px;
  }
  .check-ring {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: grid;
    place-items: center;
    font-size: 22px;
    color: var(--accent);
    opacity: 0;
    transform: scale(0.6);
    animation: check-pop 6s ease-in-out infinite;
  }
  @keyframes check-pop {
    0%, 58% { opacity: 0; transform: scale(0.6); border-color: var(--border); }
    64% { opacity: 1; transform: scale(1.12); border-color: var(--accent); box-shadow: 0 0 24px rgba(16,185,129,.25); }
    70%, 88% { opacity: 1; transform: scale(1); border-color: var(--accent); }
    94%, 100% { opacity: 0; transform: scale(0.6); }
  }
  .sms {
    background: #111;
    border: 1px solid var(--border);
    border-radius: 12px 12px 12px 4px;
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.45;
    color: var(--ink);
    max-width: 100%;
    opacity: 0;
    transform: translateY(10px);
    animation: sms-in 6s ease-in-out infinite;
  }
  .sms em { font-style: normal; color: var(--accent); font-weight: 600; }
  @keyframes sms-in {
    0%, 62% { opacity: 0; transform: translateY(10px); }
    68%, 88% { opacity: 1; transform: translateY(0); }
    94%, 100% { opacity: 0; transform: translateY(6px); }
  }
  .pulse-line {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    transform: scaleX(0);
    transform-origin: left;
    animation: progress 6s linear infinite;
  }
  @keyframes progress {
    0% { transform: scaleX(0); opacity: 0.4; }
    100% { transform: scaleX(1); opacity: 0.8; }
  }
  /* connector arrows between panels */
  .arrow {
    position: absolute;
    top: 50%;
    right: -11px;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
    opacity: 0;
    animation: arrow-flash 6s ease-in-out infinite;
    z-index: 2;
  }
  .panel:nth-child(1) .arrow { animation-delay: 0s; }
  .panel:nth-child(2) .arrow { animation-delay: 0.1s; }
  @keyframes arrow-flash {
    0%, 24% { opacity: 0; color: var(--muted); }
    28%, 48% { opacity: 1; color: var(--accent); }
    52%, 100% { opacity: 0.3; color: var(--muted); }
  }
  @media (max-width: 640px) {
    .stage { grid-template-columns: 1fr; grid-template-rows: auto auto auto; padding: 12px; gap: 10px; }
    .arrow { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .slot:nth-child(2) { border-color: var(--accent); background: var(--accent-soft); }
    .tl-block.booked, .tl-check { opacity: 1; }
    .check-ring, .sms { opacity: 1; transform: none; }
    .cursor { display: none; }
  }
</style>
</head>
<body>
<div class="stage" aria-hidden="true">
  <div class="panel">
    <div class="panel-label">Pick a slot</div>
    <div class="slots">
      <div class="slot"><b>9 – 11 AM</b><small>Earliest</small></div>
      <div class="slot pick"><b>11 AM – 1 PM</b><small>Most popular</small></div>
      <div class="slot"><b>1 – 3 PM</b><small>Afternoon</small></div>
    </div>
    <div class="cursor"></div>
    <span class="arrow">→</span>
    <div class="pulse-line"></div>
  </div>

  <div class="panel">
    <div class="panel-label">Dispatch check</div>
    <div class="timeline">
      <div class="tl-row">
        <span class="tl-name">Tech A</span>
        <div class="tl-track">
          <div class="tl-block conflict"></div>
          <span class="tl-x">✕</span>
          <div class="drive-arc">
            <svg viewBox="0 0 200 28" preserveAspectRatio="none">
              <path d="M10 20 Q60 4 110 14 T190 10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
            </svg>
          </div>
        </div>
      </div>
      <div class="tl-row">
        <span class="tl-name">Tech B</span>
        <div class="tl-track">
          <div class="tl-block booked"></div>
          <span class="tl-check">✓</span>
        </div>
      </div>
    </div>
    <span class="arrow">→</span>
    <div class="pulse-line"></div>
  </div>

  <div class="panel">
    <div class="panel-label">Confirmed</div>
    <div class="confirm-area">
      <div class="check-ring">✓</div>
      <div class="sms">Visit confirmed for <em>11 AM – 1 PM</em>. Tech en route — you'll get a reminder.</div>
    </div>
    <div class="pulse-line"></div>
  </div>
</div>
<script>
(function () {
  var niches = {
    hvac: {
      label: 'Pick a slot',
      slots: [
        ['9 – 11 AM', 'Earliest'],
        ['11 AM – 1 PM', 'Most popular'],
        ['1 – 3 PM', 'Afternoon'],
      ],
      techA: 'Tech A',
      techB: 'Tech B',
      sms: 'Visit confirmed for <em>11 AM – 1 PM</em>. Tech en route — you\'ll get a reminder.',
    },
    plumbing: {
      label: 'Pick a slot',
      slots: [
        ['8 – 10 AM', 'Morning'],
        ['10 AM – 12 PM', 'Most popular'],
        ['2 – 4 PM', 'Afternoon'],
      ],
      techA: 'Crew A',
      techB: 'Crew B',
      sms: 'Plumber booked for <em>10 AM – 12 PM</em>. Text when they\'re on the way.',
    },
    wellness: {
      label: 'Pick a time',
      slots: [
        ['9:00 AM', 'Open'],
        ['11:30 AM', 'Most popular'],
        ['3:00 PM', 'Later'],
      ],
      techA: 'Provider A',
      techB: 'Provider B',
      sms: 'Consult confirmed for <em>11:30 AM</em>. Reminder arrives 24 hours before.',
    },
    electrical: {
      label: 'Pick a slot',
      slots: [
        ['7 – 9 AM', 'Early'],
        ['12 – 2 PM', 'Most popular'],
        ['4 – 6 PM', 'Evening'],
      ],
      techA: 'Spark A',
      techB: 'Spark B',
      sms: 'Electrician confirmed for <em>12 – 2 PM</em>. Drive-time checked — no double-book.',
    },
  };

  function apply(id) {
    var n = niches[id] || niches.hvac;
    var labels = document.querySelectorAll('.panel-label');
    if (labels[0]) labels[0].textContent = n.label;
    var slotEls = document.querySelectorAll('.slot');
    n.slots.forEach(function (s, i) {
      if (!slotEls[i]) return;
      var b = slotEls[i].querySelector('b');
      var small = slotEls[i].querySelector('small');
      if (b) b.textContent = s[0];
      if (small) small.textContent = s[1];
    });
    var names = document.querySelectorAll('.tl-name');
    if (names[0]) names[0].textContent = n.techA;
    if (names[1]) names[1].textContent = n.techB;
    var sms = document.querySelector('.sms');
    if (sms) sms.innerHTML = n.sms;
  }

  var params = new URLSearchParams(location.search);
  apply(params.get('niche') || 'hvac');

  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'fieldsync-niche') return;
    apply(e.data.niche);
  });
})();
</script>
</body>
</html>
